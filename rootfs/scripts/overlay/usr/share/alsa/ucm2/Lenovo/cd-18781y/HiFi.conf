# Speaker: MultiMedia1 (PCM 0) -> QDSP6 -> quaternary MI2S -> TAS5782M.
#
# The QDSP6 back end runs at 48 kHz, 2 channels, S16_LE. The amplifier
# volume is the TAS5782M digital volume after its DSP (speaker EQ and
# protection), capped at 0 dB by the driver, so 100 % in PipeWire is the
# stock maximum.

SectionVerb {
	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixerElem "Speaker Amp Digital"
	}
}
