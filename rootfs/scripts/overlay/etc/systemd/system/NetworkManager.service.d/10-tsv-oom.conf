# If memory ever runs out system-wide, the OOM killer must not pick the way in
# to the device (adbd, NetworkManager, systemd-networkd; sshd already runs at
# -1000). straylight-listen.service runs at +500 with MemoryMax=1300M, so it is
# the one chosen, and it restarts in 2 s.
[Service]
OOMScoreAdjust=-900
