# Arch ships TimeoutSec=0 (wait forever). The gettys, serial-getty@ttyGS0 (the
# USB ACM console) included, are ordered after this unit, so a plymouthd that
# never exits would keep them away for good. After 60 s this unit fails and the
# gettys start anyway (they only have After=, not Requires=).
[Service]
TimeoutStartSec=60
