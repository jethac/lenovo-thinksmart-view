# ThinkSmart View. `plymouth-set-default-theme -R aiand` rewrites Theme= and
# rebuilds the initramfs (mkinitcpio -P).
[Daemon]
Theme=aiand
# 800x1280 at ~189 ppi: draw 1:1, never at 2x.
DeviceScale=1
# Give up on DRM after 8 s and fall back to text; plymouthd never holds up boot.
DeviceTimeout=8
ShowDelay=0
