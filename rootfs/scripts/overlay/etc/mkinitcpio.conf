# ThinkSmart View. No autodetect: the image is built in a chroot on another
# machine. Display stack loaded early so the panel can light before root.
MODULES=(msm panel-lenovo-cd-18781y-ft8201 panel-lenovo-cd-18781y-hx83100a qcom-wled)
BINARIES=()
# GPU microcode and zap shader, in case msm brings the GPU up from the initramfs.
FILES=(
  /usr/lib/firmware/qcom/a530_pm4.fw
  /usr/lib/firmware/qcom/a530_pfp.fw
  /usr/lib/firmware/qcom/msm8953/lenovo/cd-18781y/a506_zap.mdt
  /usr/lib/firmware/qcom/msm8953/lenovo/cd-18781y/a506_zap.b00
  /usr/lib/firmware/qcom/msm8953/lenovo/cd-18781y/a506_zap.b01
  /usr/lib/firmware/qcom/msm8953/lenovo/cd-18781y/a506_zap.b02
)
# HOOKS are set in /etc/mkinitcpio.conf.d/zz-tsv-hooks.conf, which is read last,
# so a later drop-in that sets its own HOOKS= cannot remove tsv-subpart.
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)
