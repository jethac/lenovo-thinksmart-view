# /etc/straylight-screen.conf: when the Straylight screen blanks and how bright
# it is. Every key is optional; these are the defaults. Read at start
# (systemctl restart straylight-voice to apply).

# Seconds without use (touch, a key, the camera cover) before the screen goes
# off; 0 never. A conversation holds it on; after one, after_conversation.
idle = 300
after_conversation = 120
# The last seconds of idle are spent at the lowest level before going off.
dim = 10

# Local time; or "off". The level is capped at quiet_level during them.
quiet_hours = 22:00-07:00
quiet_level = 1450

# "auto" follows the light sensor: auto_min in the dark, auto_max at auto_lux
# and brighter, on a log scale. Or a fixed level, 1400..4095.
brightness = auto
auto_min = 1600
auto_max = 4095
auto_lux = 300

# Wake on approach (VCNL4200, sampled twice a second only while the screen is
# off) and on the tablet being moved (accelerometer, the same).
proximity = on
proximity_threshold = 15
motion = on
motion_threshold = 0.5
motion_tilt = 1.5
