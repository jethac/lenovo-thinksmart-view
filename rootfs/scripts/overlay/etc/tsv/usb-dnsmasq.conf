# DHCP only for the USB gadget link (no DNS: port=0, no router option, so
# the laptop does not route through the tablet).
port=0
interface=usb0
bind-dynamic
except-interface=lo
dhcp-authoritative
dhcp-range=172.16.42.10,172.16.42.50,255.255.255.0,1h
dhcp-option=option:router
dhcp-option=option:dns-server
dhcp-leasefile=/run/tsv-usb-dhcp.leases
