# tsv-idle-screen. Backlight while the idle screen is up, in raw WLED units
# (0..4095). Values under 1400 are raised to 1400: the PMI8950 WLED turns the
# panel off below about 1200 (rootfs/README.md, devices/backlight/BRIEF.md).
# The level is only ever lowered, never raised, and is restored on stop.
# Empty = leave the backlight alone.
IDLE_BRIGHTNESS=2000

# Keep the wordmark upright by the accelerometer (tsv-idle-rotate, DRM/KMS).
# no = the static frame only, as drawn on /dev/fb0.
IDLE_ROTATE=yes
