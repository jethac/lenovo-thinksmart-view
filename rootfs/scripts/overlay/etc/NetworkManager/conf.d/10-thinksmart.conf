[keyfile]
# USB gadget interfaces are configured by tsv-usb-gadget.service, not by
# NetworkManager, so USB access does not depend on NetworkManager's state.
unmanaged-devices=interface-name:usb*

[connection-wifi]
match-device=type:wifi
# ath10k_sdio: keep the radio awake; the device is mains powered.
wifi.powersave=2
