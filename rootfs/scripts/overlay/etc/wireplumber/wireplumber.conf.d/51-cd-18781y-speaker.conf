# ThinkSmart View CD-18781Y speaker (TAS5782M on QDSP6 quaternary MI2S).
#
# The QDSP6 back end is fixed at 48 kHz / 2 ch / S16_LE. The front end also
# offers S24_LE, but 24-bit samples come out about 48 dB too quiet through
# this ADSP's ASM path (measured), so PipeWire is kept on S16LE at 48 kHz
# and converts everything else itself.
#
# Volume uses the amplifier's own control (UCM PlaybackMixerElem), which the
# driver caps at 0 dB: 100 % is the stock maximum, with Lenovo's speaker
# tuning in front of it. The sink suspends when idle (default 5 s), which
# puts the amplifier into standby.

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.*", api.alsa.card.name = "cd-18781y" }
    ]
    actions = {
      update-props = {
        # First-use speaker volume with no saved state: 0.027 linear
        # (-31 dB) instead of WirePlumber's 0.064 (-24 dB).
        device.routes.default-sink-volume = 0.027
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.*", alsa.card_name = "cd-18781y" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.allowed-rates = [ 48000 ]
        audio.channels = 2
        audio.position = [ FL, FR ]
      }
    }
  }
]
