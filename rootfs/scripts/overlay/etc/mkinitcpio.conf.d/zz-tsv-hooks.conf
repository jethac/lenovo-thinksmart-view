# ThinkSmart View initramfs hooks. Read after every other drop-in in this
# directory (lexical order), so it wins over any package's own
# HOOKS= drop-in. Without tsv-subpart the root filesystem (inside the
# nested MBR in PARTLABEL=system) is never found and the device does not boot.
#   plymouth     ai& splash. After udev, so the DRM device (msm + panel, loaded
#                from MODULES) is there. plymouthd daemonizes; it never blocks boot.
#   tsv-subpart  losetup -P on PARTLABEL=system (see README "Layout").
# No autodetect: the image is built in a chroot on another machine.
HOOKS=(base udev modconf plymouth tsv-subpart fsck)
